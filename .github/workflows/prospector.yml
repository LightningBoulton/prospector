name: prospector
on:
  schedule:
    - cron: "0 13 * * *"   # 7:00 AM Mountain (MDT); use "0 14 * * *" to hold at 7 in winter
  workflow_dispatch:
    inputs:
      chad_only:
        description: "Test run: email only Chad, skip Lisa"
        type: boolean
        default: false
      force_email:
        description: "Test run: send even if the report has no changes since last run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prospect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Install optional deps (LLM fit scoring)
        run: pip install -r requirements.txt   # only needed for the optional LLM fit-scoring

      - name: Run prospector (all profiles)
        id: run
        run: python jobmonitor.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # omit/unset to disable fit scoring
          # Optional: the Google Apps Script Web App bound to the tracking spreadsheet.
          # When unset, the run still writes discovery_log_<profile>.csv and simply reports
          # "sheet push not_configured" — the sheet is never the system of record.
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}

      - name: Commit updated snapshots
        run: |
          git config user.name  "prospector-bot"
          git config user.email "actions@users.noreply.github.com"
          # snapshot_*.json is STATE (carries the fit-verdict cache).
          # jobs_*.json is STATE TOO — the persistent discovery database. It carries
          # first_seen, ever_shown and the human decision fields, and the digest's
          # "removed since prior run" section is derived from it, so losing it would
          # reintroduce the bug where roles nobody had been shown appeared as removed.
          # rejects_*/source_health/feedback_template_*/discovery_log_* are diagnostics.
          # feedback_<name>.json is hand-edited and is never written by the run.
          git add snapshot_*.json jobs_*.json report_*.md report_*.html \
                  rejects_*.json source_health.json feedback_template_*.json \
                  discovery_log_*.csv
          git commit -m "Daily run: $(date -u +%Y-%m-%d)" || echo "No changes"
          git push

      - name: Email Chad's report
        if: ${{ steps.run.outputs.chad_changed == 'true' || inputs.force_email == true }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Prospector Bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO_CHAD }}
          subject: "Prospector — your daily jobs report"
          html_body: file://report_chad.html
          attachments: ${{ steps.run.outputs.chad_logos }}   # inline company logos (cid:<file>)

      - name: Email Lisa's report
        if: ${{ inputs.chad_only != true && (steps.run.outputs.lisa_changed == 'true' || inputs.force_email == true) }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Prospector Bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO_LISA }}
          subject: "Prospector — director / ops roles today"
          html_body: file://report_lisa.html
          attachments: ${{ steps.run.outputs.lisa_logos }}   # inline company logos (cid:<file>)
